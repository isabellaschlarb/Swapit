<div style="font-family: Arial, Helvetica, sans-serif; color: #0d1b3d; max-width: 420px; margin: 0 auto; padding: 24px;">
  <h2 style="margin: 0 0 8px;">Welcome to Swapit</h2>
  <p style="margin: 0 0 20px; color: #4a5470;">Type this code into Swapit to confirm your school email and sign in. It works once and expires in an hour.</p>

  <p style="margin: 0 0 24px; padding: 18px 0; background: #dcebff; border-radius: 16px; text-align: center; font-size: 40px; font-weight: bold; letter-spacing: 10px; color: #0d1b3d;">{{ .Token }}</p>

  <p style="margin: 0 0 6px; font-size: 14px; color: #4a5470;">Signing in on this device instead? Tap the link:</p>
  <p style="margin: 0 0 24px; font-size: 14px;"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="color: #0d1b3d; font-weight: bold;">Confirm with a link</a></p>

  <p style="margin: 0; font-size: 12px; color: #8a93a8;">If you didn't sign up for Swapit, you can ignore this email.</p>
</div>
